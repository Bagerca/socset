<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="profileBackgroundLayer" class="profile-background-layer"></div>

    <div class="app-container">
        <!-- САЙДБАР (Ссылки обязательно через #) -->
        <nav class="sidebar glass-pill">
            <div class="logo-icon">
                <a href="#/" title="На главную">
                    <img src="img/logo.svg" alt="Cycle Logo" class="brand-logo">
                </a>
            </div>
            <div class="nav-links">
                <a href="#/" class="nav-item nav-link" data-route="/"><i class="fa-solid fa-house"></i></a>
                <a href="#/music" class="nav-item nav-link" data-route="/music"><i class="fa-solid fa-music"></i></a>
                <a href="#/games" class="nav-item nav-link" data-route="/games"><i class="fa-solid fa-gamepad"></i></a>
                <div class="nav-item" title="Поиск"><i class="fa-solid fa-magnifying-glass"></i></div>
                <div class="nav-item" title="Уведомления"><i class="fa-solid fa-bell"></i></div>
                <a href="#/profile" class="nav-item nav-link" data-route="/profile"><i class="fa-solid fa-user"></i></a>
            </div>
        </nav>

        <!-- КОНТЕЙНЕР ДЛЯ СТРАНИЦ -->
        <main id="app-content" class="feed"></main>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ВИДЖЕТ ПЛЕЕРА -->
    <div id="globalPlayerWidget" class="global-player-widget hidden">
        <!-- КНОПКА ЗАКРЫТИЯ -->
        <button id="gpCloseBtn" class="icon-btn-small" style="position: absolute; top: 12px; right: 12px; z-index: 10;">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="gp-info">
            <img id="gpCover" src="" alt="Cover" class="gp-cover">
            <div class="gp-text">
                <div id="gpTitle" class="gp-title">Select track</div>
                <div id="gpArtist" class="gp-artist">...</div>
            </div>
        </div>
        
        <div class="gp-controls">
            <div class="gp-buttons">
                <button id="gpPrevBtn" class="gp-btn small"><i class="fa-solid fa-backward-step"></i></button>
                <button id="gpPlayBtn" class="gp-btn main"><i class="fa-solid fa-play"></i></button>
                <button id="gpNextBtn" class="gp-btn small"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="gp-progress-container">
                <span id="gpCurrentTime" class="gp-time">0:00</span>
                <input type="range" id="gpProgressBar" class="gp-slider" value="0" min="0" max="100">
                <span id="gpDuration" class="gp-time">0:00</span>
            </div>
        </div>

        <div class="gp-volume">
            <i class="fa-solid fa-volume-high" id="gpVolumeIcon"></i>
            <input type="range" id="gpVolumeBar" class="gp-slider volume-slider" value="100" min="0" max="100">
        </div>
    </div>

    <!-- Скрытый аудио тег -->
    <audio id="globalAudioPlayer" crossorigin="anonymous"></audio>

    <script type="module" src="js/app.js"></script>
</body>
</html>
