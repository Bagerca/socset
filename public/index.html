<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div id="profileBackgroundLayer" class="profile-background-layer"></div>

    <div class="app-container">
        
        <!-- ВРАППЕР ДЛЯ САЙДБАРОВ -->
        <div class="sidebar-wrapper">
            <nav class="sidebar glass-pill">
                <div class="logo-icon">
                    <a href="#/" title="На главную">
                        <img src="img/logo.svg" alt="Cycle Logo" class="brand-logo">
                    </a>
                </div>
                <div class="nav-links">
                    <a href="#/" class="nav-item nav-link" data-route="/"><i class="fa-solid fa-house"></i></a>
                    <div class="nav-item" id="burgerMenuBtn" title="Сервисы"><i class="fa-solid fa-bars"></i></div>
                    <div class="nav-item" title="Поиск"><i class="fa-solid fa-magnifying-glass"></i></div>
                    
                    <!-- КНОПКА МЕССЕНДЖЕРА -->
                    <a href="#/messages" class="nav-item nav-link" data-route="/messages" title="Мессенджер">
                        <i class="fa-regular fa-paper-plane"></i>
                    </a>
                    
                    <a href="#/notifications" id="bellIcon" class="nav-item nav-link" data-route="/notifications" title="Уведомления">
                        <i class="fa-solid fa-bell"></i>
                    </a>
                    
                    <a href="#/profile" class="nav-item nav-link" data-route="/profile"><i class="fa-solid fa-user"></i></a>
                </div>
            </nav>

            <nav class="sidebar glass-pill sub-sidebar" id="subSidebar">
                <div class="nav-links">
                    <a href="#/music" class="nav-item nav-link" data-route="/music" title="Музыка"><i class="fa-solid fa-music"></i></a>
                    <a href="#/games" class="nav-item nav-link" data-route="/games" title="Игры"><i class="fa-solid fa-gamepad"></i></a>
                    <a href="#/shop" class="nav-item nav-link" data-route="/shop" title="Магазин"><i class="fa-solid fa-store"></i></a>
                </div>
            </nav>
        </div>

        <!-- КОНТЕЙНЕР ДЛЯ СТРАНИЦ -->
        <main id="app-content" class="feed"></main>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ПАРЯЩИЙ МИНИ-ПЛЕЕР -->
    <div class="floating-mini-player hidden" id="floatingMiniPlayer">
        <div class="fmp-bg-blur" id="fmpBg"></div>
        
        <!-- Зона, за которую удобно хватать -->
        <div class="fmp-drag-handle">
            <div class="drag-bar"></div>
        </div>

        <!-- Основной контент плеера -->
        <div class="fmp-inner" id="fmpInner">
            <div class="fmp-progress-wrapper">
                <input type="range" id="fmpProgressBar" class="fmp-slider thin" value="0" min="0" max="100">
            </div>

            <div class="fmp-main-content">
                <img id="fmpCover" src="" class="fmp-cover" alt="Cover">
                <div class="fmp-info">
                    <div class="fmp-title" id="fmpTitle">Track Title</div>
                    <div class="fmp-artist" id="fmpArtist">Artist Name</div>
                </div>
                <button id="fmpFavBtn" class="icon-btn-small fmp-fav"><i class="fa-regular fa-heart"></i></button>
            </div>

            <div class="fmp-controls-row">
                <div class="fmp-time" id="fmpCurrentTime">0:00</div>
                <div class="fmp-buttons">
                    <button id="fmpShuffle" class="fmp-btn small"><i class="fa-solid fa-shuffle"></i></button>
                    <button id="fmpPrev" class="fmp-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="fmpPlay" class="fmp-btn play"><i class="fa-solid fa-play"></i></button>
                    <button id="fmpNext" class="fmp-btn"><i class="fa-solid fa-forward-step"></i></button>
                    <button id="fmpRepeat" class="fmp-btn small"><i class="fa-solid fa-repeat"></i></button>
                </div>
                <div class="fmp-time" id="fmpDuration">0:00</div>
            </div>

            <div class="fmp-volume-row">
                <i class="fa-solid fa-volume-low" id="fmpVolumeIcon"></i>
                <input type="range" id="fmpVolumeBar" class="fmp-slider vol" value="100" min="0" max="100">
            </div>
        </div>

        <!-- СЛОЙ ПРИ ВДОЛБЛЕНИИ В СТЕНУ -->
        <div class="fmp-docked-overlay" id="fmpDockedOverlay">
            <img src="" class="fmp-docked-cover" id="fmpDockedCover">
            <button id="fmpDockedPlayBtn" class="fmp-btn play docked-play"><i class="fa-solid fa-play"></i></button>
        </div>
    </div>

    <!-- Скрытый аудио тег -->
    <audio id="globalAudioPlayer" crossorigin="anonymous"></audio>

    <!-- СКРИПТЫ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
